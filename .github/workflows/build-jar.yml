name: Build JAR

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract project from zip
      run: |
        unzip -q vex-project.zip
        cd minecraft-client
        ls -la

    - name: Grant execute permission to gradlew
      run: |
        cd minecraft-client
        chmod +x gradlew

    - name: Build with Gradle
      run: |
        cd minecraft-client
        ./gradlew build

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v3
      if: success()
      with:
        name: minecraft-client-jar
        path: minecraft-client/build/libs/

    - name: List build output
      if: success()
      run: |
        echo "Build completed successfully!"
        ls -lah minecraft-client/build/libs/
